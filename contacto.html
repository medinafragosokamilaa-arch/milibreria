
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Snoopy's Library</title>

    <link rel="stylesheet" href="css/contacto.css">
</head>

<body>
    <main class="contact-section">

        <header class="form-header">
            <img src="img/snoopy.jpg"
                 alt="Snoopy leyendo"
                 class="logo">

            <h1>Snoopy's Library</h1>
            <h2>Crear una cuenta</h2>

            <p>Completa tus datos para registrarte en nuestra biblioteca.</p>
        </header>

        <form class="contact-form" action="guardar.php" method="POST">

            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre"
                   maxlength="100" autocomplete="name" required>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email"
                   maxlength="150" autocomplete="email" required>

            <label for="numero">Número de teléfono:</label>
            <input type="tel" id="numero" name="numero"
                   maxlength="20" autocomplete="tel" required>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad"
                   min="1" max="120" required>

            <label for="fecha_nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="fecha_nacimiento"
                   name="fecha_nacimiento" required>

            <label for="genero">Género:</label>
            <select id="genero" name="genero" required>
                <option value="">Selecciona una opción</option>
                <option value="Femenino">Femenino</option>
                <option value="Masculino">Masculino</option>
                <option value="Otro">Otro</option>
                <option value="Prefiero no decirlo">Prefiero no decirlo</option>
            </select>

            <label for="usuario">Nombre de usuario:</label>
            <input type="text" id="usuario" name="usuario"
                   maxlength="30" autocomplete="username" required>

            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena"
                   minlength="8" maxlength="72"
                   autocomplete="new-password" required>

            <button type="submit">Enviar registro</button>

        </form>

        <a href="Ej4.html" class="home-link">
            ⌂ Volver a la biblioteca
        </a>

    </main>
</body>
</html>
