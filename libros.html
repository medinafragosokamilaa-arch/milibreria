
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libros | Snoopy's Library</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, serif;
    background: #fff8f0;
    color: #49372e;
}

header {
    background: #a66b4f;
    color: white;
    text-align: center;
    padding: 30px 15px;
}

header h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

nav {
    background: #e8c9ae;
    padding: 15px;
    text-align: center;
}

nav a {
    text-decoration: none;
    color: #573b2c;
    font-weight: bold;
    margin: 12px;
}

.banner {
    text-align: center;
    padding: 35px 15px;
}

.banner h2 {
    font-size: 30px;
    margin-bottom: 12px;
}

.busqueda {
    text-align: center;
    margin: 15px;
}

.busqueda input {
    width: 80%;
    max-width: 500px;
    padding: 14px;
    border: 2px solid #c99d7c;
    border-radius: 20px;
    font-size: 16px;
}

.categorias {
    text-align: center;
    padding: 20px;
}

.categorias button {
    background: #a66b4f;
    color: white;
    border: none;
    padding: 10px 18px;
    margin: 5px;
    border-radius: 20px;
    cursor: pointer;
}

.categorias button:hover {
    background: #75452f;
}

.catalogo {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 25px;
    padding: 30px;
    max-width: 1400px;
    margin: auto;
}

.libro {
    background: white;
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 4px 12px #00000015;
    transition: 0.3s;
}

.libro:hover {
    transform: translateY(-7px);
}

.libro img {
    width: 100%;
    height: 230px;
    object-fit: contain;
    margin-bottom: 12px;
}

.libro h3 {
    font-size: 18px;
    margin: 8px 0;
}

.libro p {
    color: #8b6b58;
    margin-bottom: 12px;
}

.libro button {
    background: #a66b4f;
    color: white;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.libro button:hover {
    background: #75452f;
}

footer {
    background: #a66b4f;
    color: white;
    padding: 25px;
    text-align: center;
    margin-top: 30px;
}

</style>
</head>

<body>

<header>
    <h1>🐶 Snoopy's Library 📚</h1>
    <p>Un mundo de historias te espera</p>
</header>

<nav>
    <a href="Ej4.html">Inicio</a>
    <a href="libros.html">Libros</a>
    <a href="contacto.html">Registrarse</a>
    <a href="login.html">Iniciar sesión</a>
</nav>

<section class="banner">
    <h2>¡Bienvenido a nuestra biblioteca!</h2>
    <p>Descubre historias maravillosas y encuentra tu próximo libro favorito.</p>
</section>

<div class="busqueda">
    <input type="text" id="buscar"
    placeholder="🔎 Buscar un libro o autor..."
    onkeyup="buscarLibros()">
</div>

<section class="categorias">
    <button onclick="filtrar('Todos')">Todos</button>
    <button onclick="filtrar('Romance')">Romance</button>
    <button onclick="filtrar('Fantasía')">Fantasía</button>
    <button onclick="filtrar('Misterio')">Misterio</button>
    <button onclick="filtrar('Clásicos')">Clásicos</button>
    <button onclick="filtrar('Aventura')">Aventura</button>
</section>

<main class="catalogo" id="catalogo">

</main>

<footer>
    <h3>🐾 Snoopy's Library</h3>
    <p>Leer es viajar sin moverte de tu lugar.</p>
    <p>© 2026 Snoopy's Library</p>
</footer>

<script>

const libros = [
{
titulo:"Orgullo y prejuicio",
autor:"Jane Austen",
categoria:"Romance",
imagen:"https://covers.openlibrary.org/b/isbn/9780141439518-L.jpg"
},
{
titulo:"Alicia en el país de las maravillas",
autor:"Lewis Carroll",
categoria:"Fantasía",
imagen:"https://covers.openlibrary.org/b/isbn/9781503250240-L.jpg"
},
{
titulo:"Drácula",
autor:"Bram Stoker",
categoria:"Misterio",
imagen:"https://covers.openlibrary.org/b/isbn/9780141439846-L.jpg"
},
{
titulo:"Frankenstein",
autor:"Mary Shelley",
categoria:"Clásicos",
imagen:"https://covers.openlibrary.org/b/isbn/9780486282114-L.jpg"
},
{
titulo:"El principito",
autor:"Antoine de Saint-Exupéry",
categoria:"Aventura",
imagen:"https://covers.openlibrary.org/b/isbn/9780156012195-L.jpg"
},
{
titulo:"Moby Dick",
autor:"Herman Melville",
categoria:"Aventura",
imagen:"https://covers.openlibrary.org/b/isbn/9780142437247-L.jpg"
},
{
titulo:"Jane Eyre",
autor:"Charlotte Brontë",
categoria:"Romance",
imagen:"https://covers.openlibrary.org/b/isbn/9780141441146-L.jpg"
},
{
titulo:"Los miserables",
autor:"Victor Hugo",
categoria:"Clásicos",
imagen:"https://covers.openlibrary.org/b/isbn/9780451419439-L.jpg"
},
{
titulo:"El retrato de Dorian Gray",
autor:"Oscar Wilde",
categoria:"Misterio",
imagen:"https://covers.openlibrary.org/b/isbn/9780141439570-L.jpg"
},
{
titulo:"La isla del tesoro",
autor:"Robert Louis Stevenson",
categoria:"Aventura",
imagen:"https://covers.openlibrary.org/b/isbn/9780486275598-L.jpg"
},
{
titulo:"Cuento de Navidad",
autor:"Charles Dickens",
categoria:"Clásicos",
imagen:"https://covers.openlibrary.org/b/isbn/9780486268651-L.jpg"
},
{
titulo:"El jardín secreto",
autor:"Frances Hodgson Burnett",
categoria:"Fantasía",
imagen:"https://covers.openlibrary.org/b/isbn/9780141321069-L.jpg"
},
{
titulo:"Emma",
autor:"Jane Austen",
categoria:"Romance",
imagen:"https://covers.openlibrary.org/b/isbn/9780141439587-L.jpg"
},
{
titulo:"Sherlock Holmes",
autor:"Arthur Conan Doyle",
categoria:"Misterio",
imagen:"https://covers.openlibrary.org/b/isbn/9780451528018-L.jpg"
},
{
titulo:"La máquina del tiempo",
autor:"H. G. Wells",
categoria:"Fantasía",
imagen:"https://covers.openlibrary.org/b/isbn/9780451530707-L.jpg"
},
{
titulo:"Robinson Crusoe",
autor:"Daniel Defoe",
categoria:"Aventura",
imagen:"https://covers.openlibrary.org/b/isbn/9780141439822-L.jpg"
}
];

function mostrarLibros(lista) {

    const catalogo = document.getElementById("catalogo");

    catalogo.innerHTML = "";

    lista.forEach(libro => {

        catalogo.innerHTML += `
        <article class="libro">

            <img src="${libro.imagen}"
                 alt="Portada de ${libro.titulo}"
                 onerror="this.src='https://placehold.co/200x280?text=Libro'">

            <h3>${libro.titulo}</h3>

            <p>${libro.autor}</p>

            <p>${libro.categoria}</p>

            <button onclick="verLibro('${libro.titulo.replace(/'/g, "\\'")}')">
                Ver libro
            </button>

        </article>
        `;

    });

}

function filtrar(categoria) {

    if(categoria === "Todos") {
        mostrarLibros(libros);
    } else {
        mostrarLibros(
            libros.filter(libro => libro.categoria === categoria)
        );
    }

}

function buscarLibros() {

    const texto = document.getElementById("buscar")
        .value.toLowerCase();

    const resultados = libros.filter(libro =>
        libro.titulo.toLowerCase().includes(texto) ||
        libro.autor.toLowerCase().includes(texto)
    );

    mostrarLibros(resultados);

}

function verLibro(titulo) {

    const libro = libros.find(l => l.titulo === titulo);

    alert(
        "📚 " + libro.titulo +
        "\nAutor: " + libro.autor +
        "\nCategoría: " + libro.categoria
    );

}

mostrarLibros(libros);

</script>

</body>
</html>
